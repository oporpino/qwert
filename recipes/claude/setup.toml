to = "~/.claude"
macos = [
  "mkdir -p ~/.claude",
  "mkdir -p ~/.qwert/.claude",
  "if [ -f ~/.claude/settings.local.json ] && [ ! -L ~/.claude/settings.local.json ] && [ ! -f ~/.qwert/.claude/settings.local.json ]; then mv ~/.claude/settings.local.json ~/.qwert/.claude/settings.local.json; fi",
  "touch ~/.qwert/.claude/settings.local.json",
  "ln -sfn ~/.qwert/.claude/settings.local.json ~/.claude/settings.local.json",
  "ln -sfn ~/.qwert/ia/skills ~/.claude/skills",
  "ln -sfn ~/.qwert/ia/commands ~/.claude/commands",
]

[undo]
macos = [
  "rm -f ~/.claude/settings.local.json ~/.claude/skills ~/.claude/commands",
]
