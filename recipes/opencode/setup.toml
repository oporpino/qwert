to = "~/.config/opencode"
macos = [
  "mkdir -p ~/.config/opencode",
  "mkdir -p ~/.qwert/config/opencode",
  "if [ -f ~/.config/opencode/opencode.json ] && [ ! -L ~/.config/opencode/opencode.json ] && [ ! -f ~/.qwert/config/opencode/opencode.json ]; then mv ~/.config/opencode/opencode.json ~/.qwert/config/opencode/opencode.json; fi",
  "ln -sfn ~/.qwert/config/opencode/opencode.json ~/.config/opencode/opencode.json",
]

[undo]
macos = [
  "rm -f ~/.config/opencode/opencode.json",
]