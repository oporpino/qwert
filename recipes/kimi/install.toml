[meta]
name = "kimi"
version = "1.0.0"
description = "Kimi Code CLI — terminal AI agent"
type = "qwert"

[check]
command = "kimi"
version_flag = "--version"

[install]
macos = "curl -LsSf https://code.kimi.com/install.sh | bash"
debian = "curl -LsSf https://code.kimi.com/install.sh | bash"

[upgrade]
macos = "uv tool upgrade kimi-cli --no-cache"
debian = "uv tool upgrade kimi-cli --no-cache"

[uninstall]
macos = "uv tool uninstall kimi-cli"
debian = "uv tool uninstall kimi-cli"
