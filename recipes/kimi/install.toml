[meta]
name = "kimi"
version = "1.0.0"
description = "Kimi Code CLI — terminal AI agent"
type = "qwert"

[check]
command = "kimi"
version_flag = "--version"

[install]
macos = "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash"
debian = "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash"

[upgrade]
macos = "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash"
debian = "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash"

[uninstall]
macos = "rm -rf ~/.kimi-code"
debian = "rm -rf ~/.kimi-code"
