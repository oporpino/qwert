to = "~/.openclaw"
macos = [
  "mkdir -p ~/.openclaw",
  "mkdir -p ~/.qwert/config/openclaw",
  "if [ -f ~/.openclaw/openclaw.json ] && [ ! -L ~/.openclaw/openclaw.json ] && [ ! -f ~/.qwert/config/openclaw/openclaw.json ]; then mv ~/.openclaw/openclaw.json ~/.qwert/config/openclaw/openclaw.json; fi",
  "touch ~/.qwert/config/openclaw/openclaw.json",
  "ln -sfn ~/.qwert/config/openclaw/openclaw.json ~/.openclaw/openclaw.json",
]

[undo]
macos = [
  "rm -f ~/.openclaw/openclaw.json",
]